name: Diagnose conv3d (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-conv3d-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked --dev
      - name: Runner CPU
        run: |
          grep -m1 "model name" /proc/cpuinfo; nproc
          grep -m1 "^flags" /proc/cpuinfo | tr ' ' '\n' | grep -E "avx512|amx|avx2|f16c" | tr '\n' ' '; echo
      - name: Compare compiled and eager conv3d
        run: uv run python scripts/diagnose_conv3d_autocast.py
      - name: Generated code for the outer case
        run: |
          TORCH_LOGS=output_code uv run pytest -q -n 0 -p no:cacheprovider -s \
            "tests/conv3d/convrot/int8/test_padding_compile.py::test_padding_fusion_preserves_autocast_rounding[cpu-outer]" 2>&1 \
            | grep -vE "^\s*$" | tail -150 || true
      - name: Full suite
        run: uv run pytest -q -p no:cacheprovider 2>&1 | grep -E "^FAILED|passed|failed" | tail -12

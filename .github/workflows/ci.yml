name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      TRITON_CACHE_DIR: ${{ github.workspace }}/artifacts/triton-cache
      TORCHINDUCTOR_CACHE_DIR: ${{ github.workspace }}/artifacts/torchinductor-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # Hosted runners vary between AVX2, AVX-512, and AMX CPUs. Inductor generates
      # C++ kernels for the runner's vector ISA but omits the ISA from its cache keys,
      # so kernels generated on one ISA compute wrong results when reused on another.
      - name: Identify the compiler's CPU vector ISA
        id: compiler-target
        run: >-
          uv run python -c "from torch._inductor.cpu_vec_isa import pick_vec_isa;
          print('isa=' + str(pick_vec_isa()).replace(' ', '-'))" >> "$GITHUB_OUTPUT"

      - name: Cache compiled kernels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRITON_CACHE_DIR }}
            ${{ env.TORCHINDUCTOR_CACHE_DIR }}
          # Each source revision can save new entries. The compilers' own cache
          # keys invalidate changed kernels when restoring an earlier snapshot of
          # the same vector ISA.
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-target.outputs.isa }}-py313-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'benchmarks/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-target.outputs.isa }}-py313-${{ hashFiles('uv.lock') }}-

      - name: Test portable backends
        run: uv run pytest --durations=20

      - name: Build distributions without local sources
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.13 .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python -c "import importlib.metadata, piper_kernels; assert importlib.metadata.version('piper-kernels')"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install Windows test environment
        run: uv sync --locked --no-dev --group test --extra triton

      - name: Verify Windows Triton selection
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version; import triton;
          assert version('triton-windows').startswith('3.9.');
          assert triton.__version__.startswith('3.9.')"

      - name: Test portable attention backends and Triton integration
        run: >-
          uv run --no-sync pytest tests/attention tests/triton -m "not gpu"

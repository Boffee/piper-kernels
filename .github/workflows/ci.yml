name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      TRITON_CACHE_DIR: ${{ github.workspace }}/artifacts/triton-cache
      TORCHINDUCTOR_CACHE_DIR: ${{ github.workspace }}/artifacts/torchinductor-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # Hosted runners vary between AVX2, AVX-512, and AMX CPUs, and release bumps
      # modify uv.lock / pyproject.toml without changing compiler toolchains. Keying
      # caches on installed Torch/Triton versions avoids 20-minute cold recompiles.
      - name: Identify compiler target and toolchain versions
        id: compiler-target
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.metadata
          import re
          from torch._inductor.cpu_vec_isa import pick_vec_isa

          def sanitize(value: str) -> str:
              return re.sub(r"[^0-9A-Za-z._-]", "-", value)

          print("isa=" + sanitize(str(pick_vec_isa())))
          print("torch=" + sanitize(importlib.metadata.version("torch")))
          print("triton=" + sanitize(importlib.metadata.version("triton")))
          PY

      # Triton caches compiled GPU binaries (cubin/hsaco/ptx/amdgcn) and ptxas
      # spill sidecars, which are independent of the runner's host CPU ISA.
      # Only main pushes save new snapshots so PR commits reuse main's warm cache
      # without churning the repository's 10 GiB cache quota.
      - name: Cache compiled Triton kernels (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRITON_CACHE_DIR }}
          key: triton-v2-${{ runner.os }}-${{ runner.arch }}-py314-triton-${{ steps.compiler-target.outputs.triton }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            triton-v2-${{ runner.os }}-${{ runner.arch }}-py314-triton-${{ steps.compiler-target.outputs.triton }}-

      - name: Restore compiled Triton kernels (PR)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRITON_CACHE_DIR }}
          key: triton-v2-${{ runner.os }}-${{ runner.arch }}-py314-triton-${{ steps.compiler-target.outputs.triton }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            triton-v2-${{ runner.os }}-${{ runner.arch }}-py314-triton-${{ steps.compiler-target.outputs.triton }}-

      - name: Cache compiled Inductor kernels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TORCHINDUCTOR_CACHE_DIR }}
          # Each source revision can save new entries; Inductor's own cache keys
          # invalidate changed graphs when restoring an earlier same-ISA snapshot.
          key: inductor-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-target.outputs.isa }}-py314-torch-${{ steps.compiler-target.outputs.torch }}-triton-${{ steps.compiler-target.outputs.triton }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            inductor-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-target.outputs.isa }}-py314-torch-${{ steps.compiler-target.outputs.torch }}-triton-${{ steps.compiler-target.outputs.triton }}-

      - name: Test portable backends
        run: uv run pytest --durations=20

      - name: Build distributions without local sources
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.14 .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python -c "import importlib.metadata, piper_kernels; assert importlib.metadata.version('piper-kernels')"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install Windows test environment
        run: uv sync --locked --no-dev --group test --extra triton

      - name: Verify Windows Triton selection
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version; import triton;
          assert version('triton-windows').startswith('3.9.');
          assert triton.__version__.startswith('3.9.')"

      - name: Test portable attention backends and Triton integration
        run: >-
          uv run --no-sync pytest tests/attention tests/triton -m "not gpu"
